{% extends 'dashboard/base_dashboard.html' %}

{% block dashboard_content %}
<div style="max-width: 800px; margin: 0 auto;">
  <div style="margin-bottom: 2rem;">
    <a href="{% url 'dashboard:packages' %}" style="font-size: 0.85rem; font-weight: 600; color: var(--color-slate-600);">← Back to Package List</a>
    <h1 style="font-size: 2rem; margin-top: 0.3rem;">Create New Travel Package</h1>
  </div>

  <div style="background: #FFFFFF; padding: 2.5rem; border-radius: var(--radius-xl); border: 1px solid var(--color-slate-200); box-shadow: var(--shadow-sm);">
    <form method="post" enctype="multipart/form-data" action="{% url 'dashboard:package_create' %}">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label">Package Title *</label>
        <input type="text" name="title" class="form-input" required placeholder="e.g. 5-Day Bali Luxury Villa & Island Escape">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label">Destination *</label>
          <select name="destination" class="form-input" required>
            {% for d in destinations %}
              <option value="{{ d.id }}">{{ d.name }} ({{ d.country }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Starting Price ($) *</label>
          <input type="number" step="0.01" name="price_per_person" class="form-input" required placeholder="1499.00">
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label">Duration Days</label>
          <input type="number" name="duration_days" value="5" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Duration Nights</label>
          <input type="number" name="duration_nights" value="4" class="form-input" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Overview Description *</label>
        <textarea name="overview" class="form-input" rows="5" required placeholder="Comprehensive holiday overview..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Inclusions (One item per line)</label>
        <textarea name="inclusions" class="form-input" rows="4" placeholder="4 nights luxury villa accommodation&#10;Daily buffet breakfast&#10;Airport private transfers"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Exclusions (One item per line)</label>
        <textarea name="exclusions" class="form-input" rows="3" placeholder="International airfare&#10;Personal travel insurance&#10;Tips & gratuities"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Travel Requirements & Visa Info</label>
        <textarea name="travel_requirements" class="form-input" rows="2" placeholder="Passport valid for 6 months, tourist visa required on arrival."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Cover Image</label>
        <input type="file" name="cover_image" class="form-input">
      </div>

      <div style="display: flex; gap: 2rem; align-items: center; margin-top: 1.5rem; margin-bottom: 2rem;">
        <div class="form-group" style="margin: 0; display: flex; align-items: center; gap: 0.5rem;">
          <input type="checkbox" name="is_featured" id="is_featured">
          <label for="is_featured" style="font-weight: 600;">Feature on Homepage</label>
        </div>

        <div class="form-group" style="margin: 0; display: flex; align-items: center; gap: 0.5rem;">
          <label class="form-label" style="margin: 0;">Status:</label>
          <select name="status" class="form-input" style="width: 150px;">
            <option value="DRAFT">Draft</option>
            <option value="PUBLISHED" selected>Published</option>
            <option value="ARCHIVED">Archived</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem;">
        Publish Travel Package
      </button>
    </form>
  </div>
</div>
{% endblock %}
