{% extends 'base.html' %}
{% block title %}Sign In | {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div class="container" style="padding: 5rem 1.5rem;">
  <div style="max-width: 460px; margin: 0 auto; background: #FFFFFF; padding: 2.75rem 2.25rem; border-radius: var(--radius-xl); border: 1px solid var(--border); box-shadow: var(--shadow-xl);" data-reveal>
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 56px; height: 56px; background: var(--primary-light); color: var(--primary); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto;">
        <svg class="icon icon-lg" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 style="font-size: 1.75rem; margin-bottom: 0.35rem; color: var(--navy);">Portal Sign In</h1>
      <p style="font-size: 0.9rem; color: var(--text-muted);">Access your booking portal and travel details</p>
    </div>

    <form method="post" action="{% url 'accounts:login' %}{% if next %}?next={{ next }}{% endif %}" data-loading-state>
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" required autofocus placeholder="Enter your username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" required placeholder="Enter your password">
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 1.25rem;">
        Sign In to Portal
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="{% url 'accounts:register' %}" style="font-weight: 600; color: var(--primary);">Register Now</a>
    </div>
  </div>
</div>
{% endblock %}
