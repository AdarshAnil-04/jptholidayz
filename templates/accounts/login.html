{% extends 'base.html' %}
{% block title %}Sign In | {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div class="container" style="padding: 5rem 0;">
  <div style="max-width: 450px; margin: 0 auto; background: #FFFFFF; padding: 2.5rem; border-radius: var(--radius-xl); border: 1px solid var(--color-slate-200); box-shadow: var(--shadow-md);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <span style="font-size: 2.5rem;">🔑</span>
      <h1 style="font-size: 1.75rem; margin-top: 0.5rem;">Customer & Staff Sign In</h1>
      <p style="font-size: 0.9rem; color: var(--color-slate-600); margin-top: 0.25rem;">Access your booking portal and travel details</p>
    </div>

    <form method="post" action="{% url 'accounts:login' %}{% if next %}?next={{ next }}{% endif %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" required autofocus placeholder="Enter your username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" required placeholder="Enter your password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 1rem;">
        Sign In to Portal
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--color-slate-200); font-size: 0.9rem;">
      Don't have an account? <a href="{% url 'accounts:register' %}" style="font-weight: 600; color: var(--color-gold);">Register Now</a>
    </div>
  </div>
</div>
{% endblock %}
