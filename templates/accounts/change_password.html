{% extends 'base.html' %}
{% block title %}Change Password | {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 0;">
  <div style="max-width: 480px; margin: 0 auto; background: #FFFFFF; padding: 2.5rem; border-radius: var(--radius-xl); border: 1px solid var(--color-slate-200);">
    <h1 style="font-size: 1.5rem; margin-bottom: 1.5rem;">🔒 Change Password</h1>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div style="color: var(--color-danger); font-size: 0.85rem; margin-top: 0.25rem;">
              {{ field.errors.0 }}
            </div>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary" style="width: 100%;">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
